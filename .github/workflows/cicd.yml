name: node-js ci
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
permissions: 
  contents: write
env:
  IMAGE_TAG: ${{github.sha}}
jobs:
  compile:
    runs-on: ubuntu-22.04
    steps:
      - name: checkout-code
        uses: actions/checkout@v4
      - name: setup node js
        uses: actions/setup-node@v4
        with:
          node-version: '23'
      - name: frontend compilation syntax check
        run:
          cd client
          find . -name "*.js" -exec node --check {} +
      - name: backend compilation syntax check
        run:
          cd api
          find . -name "*.js" -exec node --check {} +
  gitleaks-scan:
    runs-on: ubuntu-22.04
    needs: compile
    steps:
      - name: checkout-code
        uses: actions/checkout@v4
      - name: gitleaks setup
        uses: gitleaks/gitleaks-action@v2
      - name: gitleak scan
        run: |
          gitleaks detect --source ./client --exit-code 1
          gitleaks detect --source ./api --exit-code 1
  trivy-fs-scan:
    runs-on: ubuntu-22.04
    needs: gitleaks-scan
    steps:
      - name: checkout-code
        uses: actions/checkout@v4
      - name: Run Trivy vulnerability scanner in fs mode
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: table
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
  build_backend_docker_image_push:
    runs-on: ubuntu-22.04
    needs: trivy-fs-scan
    steps:
      - name: checkout-code
        uses: actions/checkout@v4
      - name: docker login
        uses: docker/login-actions@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ vars.DOCKERHUB_TOKEN }}
      - name: setup QEMU
        uses: docker/setup-qemu-action@v3
      - name: setup docker buildx
        uses: docker/setup-buildx-action@v3
      - name: build and push
        uses: docker/build-push-action@v6
        with:
          context: ./api
          file: ./api/Dockerfile
          push: true
          tags:
            sourodip290301/backend:latest
            sourodip290301/backend:${{ env.IMAGE_TAG }}
        
  build_frontend_docker_image_push:
  runs-on: ubuntu-22.04
  needs: trivy-fs-scan

  steps:
    - name: checkout-code
      uses: actions/checkout@v4

    - name: docker login
      uses: docker/login-action@v3
      with:
        username: ${{ vars.DOCKERHUB_USERNAME }}
        password: ${{ vars.DOCKERHUB_TOKEN }}

    - name: setup QEMU
      uses: docker/setup-qemu-action@v3

    - name: setup docker buildx
      uses: docker/setup-buildx-action@v3

    - name: build and push
      uses: docker/build-push-action@v6
      with:
        context: ./client
        file: ./client/Dockerfile
        push: true
        tags: |
          sourodip290301/frontend:latest
          sourodip290301/frontend:${{ env.IMAGE_TAG }}
      
     
  trivy-image-scan:
  runs-on: ubuntu-22.04
  needs:
    - build_backend_docker_image_push
    - build_frontend_docker_image_push

  steps:
    - name: checkout-code
      uses: actions/checkout@v4

    - name: Run Trivy scan for backend
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        scan-type: image
        image-ref: sourodip290301/backend:${{ env.IMAGE_TAG }}
        format: table
        exit-code: 0
        ignore-unfixed: true
        vuln-type: os,library
        severity: CRITICAL,HIGH

    - name: Run Trivy scan for frontend
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        scan-type: image
        image-ref: sourodip290301/frontend:${{ env.IMAGE_TAG }}
        format: table
        exit-code: 0
        ignore-unfixed: true
        vuln-type: os,library
        severity: CRITICAL,HIGH
        
   update_cd_repo:
    runs-on: ubuntu-latest
    needs: trivy-image-scan
    steps:
      - name: Checkout CD repo
        uses: actions/checkout@v4
        with:
          repository: Sourodip2001/3-Tier-GitOps-CD
          ref: main
          token: ${{ secrets.CD_REPO_TOKEN }}
          path: cd

      - name: Bump images in manifests (safe)
        working-directory: cd
        env:
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
        run: |
          curl -sL https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64 -o yq && sudo install yq /usr/local/bin/yq

          # -- Safety cleanup: remove any accidental .spec.template from Service docs
          yq -i '(. | select(.kind=="Service")) |= del(.spec.template)' k8s-prod/backend.yaml
          yq -i '(. | select(.kind=="Service")) |= del(.spec.template)' k8s-prod/frontend.yaml

          # -- Update ONLY Deployment images (backend)
          yq -i '
            (. | select(.kind=="Deployment")
               | .spec.template.spec.containers[]
               | select(.name=="backend")
               | .image)
            = "sourodip290301/backend:" + strenv(IMAGE_TAG)
          ' k8s-prod/backend.yaml

          # -- Update ONLY Deployment images (frontend)
          yq -i '
            (. | select(.kind=="Deployment")
               | .spec.template.spec.containers[]
               | select(.name=="frontend")
               | .image)
            = "sourodip290301/frontend:" + strenv(IMAGE_TAG)
          ' k8s-prod/frontend.yaml

      - name: Commit & push to CD repo
        working-directory: cd
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add -A
          git commit -m "bump images to ${IMAGE_TAG}" || echo "no changes"
          git push      
      
       
